<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HC UI Gallery</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e8edf5;background:#0b101a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#20304c,#0b101a 52%)}main{max-width:1200px;margin:auto;padding:34px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:800;letter-spacing:.1em}.tag{border:1px solid #34445b;border-radius:30px;padding:7px 12px;color:#9eb0c8;font-size:12px}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.05em;margin:56px 0 12px}p{color:#a4b1c4;line-height:1.6;max-width:640px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:30px 0}button{cursor:pointer;background:#172133;border:1px solid #2d3b50;color:#dce6f5;padding:10px 16px;border-radius:10px}button.active{background:#e9eef7;color:#0b101a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:#131d2b;border:1px solid #263449;border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#8197b5}.preview{height:172px;background:linear-gradient(130deg,#253a58,#101826);padding:16px}.mock{height:100%;border:1px solid #40536e;border-radius:7px;background:#0c1422;display:grid;grid-template-columns:48px 1fr;overflow:hidden}.side{background:#1b2b42;padding:10px 8px}.side i{display:block;height:5px;background:#617a9b;border-radius:6px;margin-bottom:12px}.content{padding:14px}.content b{display:block;width:65%;height:10px;background:#849ab7;border-radius:4px;margin-bottom:14px}.bars{display:flex;gap:6px}.bars i{height:42px;flex:1;border-radius:5px;background:linear-gradient(140deg,#476b99,#263c59)}.lines{margin-top:12px}.lines i{display:block;background:#354964;height:6px;margin:8px 0;border-radius:4px}.info{padding:18px}h3{margin:0 0 7px}small{color:#8ba0bc}a{display:inline-block;margin-top:16px;color:#b7d4ff;text-decoration:none;font-size:14px}.footer{margin-top:40px;color:#778ca7;font-size:12px}</style></head><body><main><header><div class="logo">HC<span style="color:#7dafff">DECOR</span> / UI LIBRARY</div><span class="tag">LOCAL FIRST · V1</span></header><h1>Good design.<br>Ready to build.</h1><p>Kho giao diện và source để chọn trước khi lập trình. Bấm “Xem demo / source” để mở dự án gốc. Mỗi mẫu có thể tùy biến cho HCDecor.</p><div class="filters" id="filters"></div><div class="grid" id="grid"></div><div class="footer">HC UI Design Arsenal · Demo links may require Internet · Source tại D:\HCDecorHUB\HC UI Library</div></main><script>const data=[['Tabler','Dashboard','https://preview.tabler.io/','02-Dashboard/tabler'],['CoreUI React','Dashboard','https://coreui.io/product/free-react-admin-template/','02-Dashboard/coreui-free-react-admin-template'],['AdminLTE','Dashboard','https://adminlte.io/','02-Dashboard/adminlte'],['Astro Cactus','Luxury','https://github.com/chrismwilliams/astro-theme-cactus','01-Luxury/astro-theme-cactus'],['Next.js Commerce','Commerce','https://github.com/vercel/commerce','04-Commerce/nextjs-commerce'],['shadcn/ui','Components','https://ui.shadcn.com/blocks','06-Components/shadcn-ui'],['Lucide Icons','Icons','https://lucide.dev/icons/','07-Icons/lucide'],['Tabler Icons','Icons','https://tabler.io/icons','07-Icons/tabler-icons'],['Motion','Animation','https://motion.dev/','08-Animation/motion'],['ECharts','Charts','https://echarts.apache.org/examples/en/index.html','09-Charts/echarts'],['Style Dictionary','Tools','https://styledictionary.com/','10-Design-Tokens/style-dictionary'],['Playwright','Tools','https://playwright.dev/','11-Visual-QA/playwright']];let selected='All';const cats=['All',...new Set(data.map(x=>x[1]))];function draw(){document.getElementById('filters').innerHTML=cats.map(c=>'<button class="'+(c===selected?'active':'')+'" onclick="selected=\''+c+'\';draw()">'+c+'</button>').join('');document.getElementById('grid').innerHTML=data.filter(x=>selected==='All'||x[1]===selected).map((x,i)=>'<article class="card"><div class="preview" style="filter:hue-rotate('+(i*22)+'deg)"><div class="mock"><div class="side"><i></i><i></i><i></i><i></i></div><div class="content"><b></b><div class="bars"><i></i><i></i><i></i></div><div class="lines"><i></i><i></i><i></i></div></div></div></div><div class="info"><small>'+x[1]+'</small><h3>'+x[0]+'</h3><small>'+x[3]+'</small><div><a href="'+x[2]+'" target="_blank" rel="noopener">Xem demo / source ↗</a></div></div></article>').join('')}draw();</script></body></html>
