<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HCDecor Visual Builder</title><link rel="stylesheet" href="admin.css?v=31"></head><body>
<div class="builder"><header class="topbar"><a href="/" class="brand"><b>HC</b> HCDecor <span>HUB</span></a><div class="devices"><button data-device="desktop" class="active">▣ <i>Desktop</i></button><button data-device="tablet">▯ <i>Tablet</i></button><button data-device="mobile">▯ <i>Mobile</i></button></div><div class="actions"><span id="saveState">Đã lưu</span><button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button><button id="historyBtn">Lịch sử</button><button id="draftBtn">Lưu Draft</button><button id="publishBtn" class="primary">Publish</button></div></header>
<aside class="layers"><div class="side-head"><b>Layers</b><small>Trang chủ</small></div><div id="layerList"></div></aside>
<main class="canvas"><div id="frameShell" class="desktop"><iframe id="siteFrame" src="/?adminPreview=1&builder=31" title="HCDecor website canvas"></iframe></div></main>
<aside class="inspector" id="inspector"><div class="handle"></div><div class="empty" id="empty"><b>Chọn nội dung trên website</b><p>Chạm/click chữ, ảnh, card hoặc section để chỉnh trực quan.</p></div><div id="properties" hidden><div class="prop-head"><div><small>ĐANG CHỈNH</small><h2 id="selectedLabel">Hero</h2></div><button id="closeInspector">×</button></div><div id="contentFields"></div><details open><summary>Typography</summary><label>Font<select id="fontFamily"><option value="system-ui,-apple-system,Segoe UI,sans-serif">Sans hiện đại</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Serif</option></select></label><label>Cỡ tiêu đề <output id="headingSizeOut"></output><input id="headingSize" type="range" min="24" max="88"></label><label>Màu nhấn<input id="accentColor" type="color"></label></details><details open><summary>Layout</summary><label>Bo góc <output id="radiusOut"></output><input id="radius" type="range" min="0" max="36"></label><label>Khoảng cách section <output id="sectionGapOut"></output><input id="sectionGap" type="range" min="24" max="140"></label><div class="row"><button id="moveUp">↑ Lên</button><button id="moveDown">↓ Xuống</button></div><button id="toggleVisible">Ẩn section</button></details></div></aside>
<div class="history-drawer" id="historyDrawer"><div><b>Lịch sử phiên bản</b><button id="closeHistory">×</button></div><div id="historyList"></div></div></div>
<script src="admin.js?v=31"></script></body></html>
