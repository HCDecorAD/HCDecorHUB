<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HCDecor Visual Builder</title><link rel="stylesheet" href="admin.css?v=20"></head><body><div class="builder"><header><a class="brand" href="/"><b>HC</b> HCDecor</a><div class="device"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div><div class="top-actions"><span id="saveState">Đã lưu</span><button id="undo">↶</button><button id="redo">↷</button><button id="openSite">Xem website ↗</button></div></header><aside class="left"><h3>Trang chủ</h3><p class="muted">Chọn một khối để chỉnh sửa</p><div id="layers"></div></aside><main class="stage"><div id="frameShell" class="desktop"><iframe id="siteFrame" src="/?adminPreview=1&builder=20"></iframe></div></main><aside class="right"><div id="emptyInspector" class="empty"><b>Visual Editor</b><p>Bấm trực tiếp vào chữ, ảnh hoặc section trên website để chỉnh.</p></div><div id="inspector" hidden><div class="inspector-head"><small>ĐANG CHỈNH</small><h2 id="selectedName">Section</h2></div><div id="contentFields"></div><details open><summary>Thiết kế</summary><label>Font<select id="fontFamily"><option value="system-ui,-apple-system,sans-serif">Sans hiện đại</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Serif</option></select></label><label>Cỡ tiêu đề <output id="headingSizeOut"></output><input id="headingSize" type="range" min="28" max="88"></label><label>Màu nhấn<input id="accentColor" type="color"></label><label>Bo góc <output id="radiusOut"></output><input id="radius" type="range" min="0" max="36"></label></details><details><summary>Bố cục</summary><label>Khoảng cách section <output id="sectionGapOut"></output><input id="sectionGap" type="range" min="24" max="140"></label><button id="hideSection">Ẩn / hiện section</button><div class="move"><button id="moveUp">↑ Lên</button><button id="moveDown">↓ Xuống</button></div></details></div></aside></div><script src="admin.js?v=20"></script></body></html>
