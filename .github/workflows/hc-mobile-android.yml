name: HC Mobile Android
on:
  workflow_dispatch:
  push:
    paths:
      - "HC-Dual-Lane-Mobile/mobile-agent/**"
      - ".github/workflows/hc-mobile-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HC-Dual-Lane-Mobile/mobile-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HC-Mobile-debug
          path: HC-Dual-Lane-Mobile/mobile-agent/app/build/outputs/apk/debug/app-debug.apk
