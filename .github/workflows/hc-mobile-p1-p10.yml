name: HC Mobile P1-P10
on:
  workflow_dispatch:
  push:
    paths:
      - 'HC-Dual-Lane-Mobile/mobile-agent/**'
jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HC-Dual-Lane-Mobile/mobile-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable dev signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hc-mobile-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HC-Mobile-Agent-debug
          path: HC-Dual-Lane-Mobile/mobile-agent/app/build/outputs/apk/debug/app-debug.apk
