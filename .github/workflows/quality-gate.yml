name: HCDecor HUB Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcdecor-hub-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Architecture contract
        run: npm run test:architecture
      - name: Commerce contract
        run: node scripts/commerce-contract-check.mjs
      - name: Persistence contract
        run: node scripts/persistence-contract-check.mjs
      - name: Production build
        run: npm run build
      - name: Master Agent local E2E
        shell: bash
        run: |
          HC_ALLOW_LOCAL_E2E=true npm run start -- -p 3219 > /tmp/hcdecor-next.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3219/api/master/readiness >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3219/api/master/readiness >/dev/null
          HC_ALLOW_LOCAL_E2E=true npm run test:master
      - name: Cloudflare build
        run: npm run cf:build
