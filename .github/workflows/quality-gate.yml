name: HCDecor HUB Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcdecor-hub-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.risk.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: risk
        shell: bash
        run: |
          files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -Ev '^(docs/|.*\.md$|.*\.txt$|\.github/ISSUE_TEMPLATE/|config/HC-DONE-ALL\.manifest\.json$)' >/dev/null; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "HC_DONE_RISK_FAST documentation_or_metadata_only=1"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "HC_DONE_RISK_FULL runtime_or_contract_change=1"
          fi
  quality:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Architecture contract
        run: npm run test:architecture
      - name: Foundation authority and identity contract
        run: node scripts/foundation-contract-check.mjs
      - name: DR readiness contract
        run: node scripts/dr-readiness-check.mjs
      - name: Commerce contract
        run: node scripts/commerce-contract-check.mjs
      - name: Persistence contract
        run: node scripts/persistence-contract-check.mjs
      - name: Dynamic port contract
        run: npm run test:dynamic-port
      - name: Governor resource scheduler v0
        run: npm run test:governor
      - name: Durable budget ledger gate
        run: npm run test:durable-budget
      - name: Governor durable queue v0
        run: npm run test:governor-durable
      - name: Durable worker heartbeat gate
        run: npm run test:worker-heartbeats
      - name: Durable DONE supervisor v0
        run: npm run test:done-durable
      - name: HC Group DONE package gate
        run: npm run test:hc-group-done-package
      - name: Remaining DONE program gate
        run: npm run test:remaining-done-plan
      - name: TransWarp durable recovery acceptance
        run: npm run test:transwarp-acceptance
      - name: HC Group portfolio pilot
        run: npm run test:portfolio-pilot
      - name: HC Group MOON gate
        run: npm run test:moon-gate
      - name: Deployment adapter gate
        run: npm run test:deployment-adapter
      - name: Policy engine gate
        run: npm run test:policy-engine
      - name: Durable runtime adapter gate
        run: npm run test:durable-adapter
      - name: Social media gate
        run: npm run test:social-media
      - name: Unified evidence envelope gate
        run: npm run test:evidence-envelope
      - name: Durable evidence store gate
        run: npm run test:evidence-store
      - name: Evidence archive index gate
        run: npm run test:evidence-archive-index
      - name: iMaster V3 autonomous/public state gate
        run: npm run test:imaster-v3
      - name: iMaster bootstrap anti-amnesia gate
        run: npm run test:imaster-bootstrap
      - name: iMaster capability acquisition gate
        run: npm run test:imaster-capability-acquisition
      - name: iMaster ALL Phase freeze gate
        run: npm run test:imaster-all-phase
      - name: Target repo bootstrap and parity gate
        run: npm run test:repo-target-bootstrap
      - name: Repo source integrity gate
        run: npm run test:repo-integrity
      - name: Repo extraction package gate
        run: npm run test:repo-extraction
      - name: Repo decomposition parity gate
        run: npm run test:repo-decomposition
      - name: Corporate catalog gate
        run: npm run test:corporate-catalog
      - name: HCDR relay implementation contract
        run: npm run test:hcdr-relay-contract
      - name: HCDR always-on receiver gate
        run: npm run test:hcdr-always-on
      - name: HCDR mobile remote one-shot gate
        run: npm run test:hcdr-mobile-remote-done
      - name: Mobile HC DONE cloud/offline orchestration gate
        run: npm run test:mobile-hc-done-cloud
      - name: HC Agent Control source contract
        run: npm run test:agent-control-contract
      - name: Agent Control runtime gate
        run: npm run test:agent-control-runtime
      - name: AutoChat runtime gate
        run: npm run test:autochat-runtime
      - name: HC AutoChat source contract
        run: npm run test:autochat-contract
      - name: HC MediaFlow source contract
        run: npm run test:mediaflow-contract
      - name: Media runtime bundle gate
        run: npm run test:mediaflow-runtime && npm run test:video-downloader-runtime && npm run test:design-ai-runtime
      - name: HC Video Downloader source contract
        run: npm run test:video-downloader-contract
      - name: HC Design AI Studio source contract
        run: npm run test:design-ai-contract
      - name: Active asset coverage gate
        run: npm run test:active-asset-coverage
      - name: Capability registry gate
        run: npm run test:capability-registry
      - name: Verified fix memory gate
        run: npm run test:fix-memory
      - name: AutoDebug source implementation
        run: npm run test:autodebug-implementation
      - name: AutoDebug repair verification source implementation
        run: npm run test:autodebug-repair
      - name: Operator dashboard gate
        run: npm run test:operator-dashboard
      - name: Operator telemetry authority gate
        run: npm run test:operator-telemetry
      - name: Goal mission lifecycle registry gate
        run: npm run test:lifecycle-registry
      - name: Production build
        run: npm run build
      - name: Master Agent local E2E
        shell: bash
        run: |
          PORT="$(node scripts/allocate-test-port.mjs 3219 3299)"
          export HCDECOR_E2E_BASE="http://localhost:$PORT"
          echo "HC dynamic port: $PORT"
          HC_ALLOW_LOCAL_E2E=true npm run start -- -p "$PORT" > /tmp/hcdecor-next.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..45}; do
            if curl -fsS "$HCDECOR_E2E_BASE/api/master/readiness" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$HCDECOR_E2E_BASE/api/master/readiness" >/dev/null
          HC_ALLOW_LOCAL_E2E=true npm run test:master
      - name: Cloudflare build
        run: npm run cf:build

  fast-pass:
    needs: classify
    if: needs.classify.outputs.full == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "HC_DONE_FAST_PASS non_runtime_change=1 full_regression_skipped=1"
