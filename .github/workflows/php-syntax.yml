name: HCDecor PHP Syntax Gate
on:
  push:
    branches: [main]
    paths: ['wordpress/hcdecor-core/**/*.php']
  pull_request:
    paths: ['wordpress/hcdecor-core/**/*.php']
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4','8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint every HCDecor PHP file
        run: find wordpress/hcdecor-core -name '*.php' -print0 | xargs -0 -n1 php -l
