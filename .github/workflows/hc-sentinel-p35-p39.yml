name: HC Sentinel P35-P39

on:
  push:
    branches: [hc-sentinel-p35-p39]
    paths:
      - "HC_Sentinel/**"
      - ".github/workflows/hc-sentinel-p35-p39.yml"
  workflow_dispatch:

jobs:
  p35-p39:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: HC_Sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: P35 Windows Install
        run: npm run test:p35
      - name: P36 Hidden Launch
        run: npm run test:p36
      - name: P37 Evidence Viewer
        run: npm run test:p37
      - name: P38 Finding Inbox
        run: npm run test:p38
      - name: P39 HCDR Status Sync
        run: npm run test:p39
      - name: P35-P39 Smoke
        run: node scripts/p35-p39-smoke.js
      - name: Full Regression
        run: npm test
