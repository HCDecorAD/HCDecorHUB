name: HCDecor HUB Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcdecor-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Architecture contract
        run: npm run test:architecture
      - name: Commerce contract
        run: node scripts/commerce-contract-check.mjs
      - name: Persistence contract
        run: node scripts/persistence-contract-check.mjs
      - name: Cloudflare build
        run: npm run cf:build
      - name: Deploy HCDecor HUB Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Strict production verification
        shell: pwsh
        run: ./scripts/production-smoke.ps1
