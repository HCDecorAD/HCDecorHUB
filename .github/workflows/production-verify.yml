name: HCDecor HUB Production Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: hcdecor-production-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Strict production smoke
        shell: pwsh
        run: ./scripts/production-smoke.ps1
      - name: Verify public sites and Shop Engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'https://hcdecorhub.com',
            'https://gscsenior.hcdecorhub.com',
            'https://amonguyen.hcdecorhub.com',
            'https://hc-shop-engine.huycuongonline.workers.dev/api/health'
          )
          foreach($url in $targets){
            $r=Invoke-WebRequest -UseBasicParsing $url -TimeoutSec 20
            if($r.StatusCode -ne 200){throw "$url status $($r.StatusCode)"}
          }
          Write-Output 'PRODUCTION_VERIFY_PASS'
